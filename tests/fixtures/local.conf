# Appended to conf/local.conf of the test build directory (see
# tests/integration_setup.sh).  tests/test_integration.py checks the result
# of each line.
MACHINE ?= "qemuarm"
IMAGE_INSTALL += "yrd-sample"
IMAGE_INSTALL:append = " yrd-include"
IMAGE_INSTALL:append:qemuarm = " yrd-arm"
YRD_CONF_BLOCK += "x"
YRD_CONF_PN:pn-yrd-sample = "for-sample"
YRD_CONF_PN:pn-yrd-nothing = "typo"
YRD_CONF_NATIVE:class-native = "native"
YRD_CONF_TWICE = "one"
YRD_CONF_TWICE = "two"
RDEPENDS:yrd-sample:append = " yrd-package"
